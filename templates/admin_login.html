<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ нэвтрэх</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white grid place-items-center p-4"><main class="w-full max-w-md rounded-2xl border border-blue-900 bg-slate-900 p-7"><a href="/" class="text-blue-300 text-sm">← Сайт руу буцах</a><img src="/static/images/logo.png.png" alt="Коллежийн лого" class="w-20 h-20 rounded-full object-cover mx-auto mt-5 border-2 border-amber-400 shadow-xl"><h1 class="text-2xl font-bold mt-5">Админ нэвтрэх</h1><p class="text-slate-400 text-sm mt-2">Мэргэжлийн жагсаалтыг удирдах хэсэг</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="mt-4 rounded-lg p-3 text-sm {{ 'bg-red-950 text-red-200' if category == 'error' else 'bg-emerald-950 text-emerald-200' }}">{{ message }}</div>{% endfor %}<form method="post" class="space-y-4 mt-6"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label class="block text-sm">Нэвтрэх нэр<input name="username" required autocomplete="username" class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 p-3"></label><label class="block text-sm">Нууц үг<input type="password" name="password" required autocomplete="current-password" class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 p-3"></label><button class="w-full rounded-lg bg-blue-600 hover:bg-blue-500 p-3 font-bold">Нэвтрэх</button></form><p class="text-xs text-slate-500 mt-5">Нэвтрэх мэдээллийг төслийн .env файлд тохируулна.</p></main></body></html>
